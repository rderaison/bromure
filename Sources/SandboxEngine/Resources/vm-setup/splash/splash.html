<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; connect-src 'self' file:; img-src 'self' data: file:; font-src 'self' file:;">
<title>Bromure — Connecting VPN</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Bromure 2026 Brand Guide, supplied by bromure_web: offline assets only. */
  @font-face { font-family: Manrope; src: url('fonts/Manrope-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Inter Tight'; src: url('fonts/InterTight.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Fragment Mono'; src: url('fonts/FragmentMono.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  :root {
    color-scheme: light dark;
    --bg: #000000;
    --fg: #FFFFFF;
    --muted-fg: #9AA5C4;
    --accent: #93AEFF;
    --accent-text: #000000;
    --accent-strong: #93AEFF;
    --border: #222840;
    --panel: #0E1220;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #FFFFFF;
      --fg: #000000;
      --muted-fg: #55618A;
      --accent: #5866FE;
      --accent-text: #FFFFFF;
      --accent-strong: #33497B;
      --border: #DCE2F8;
      --panel: #F4F6FD;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; width: 100%; }
  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px;
  }
  .card {
    width: 100%; max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 40px;
    text-align: center;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-family: Manrope, system-ui, sans-serif;
    font-size: 26px; font-weight: 600; letter-spacing: -0.03em;
    color: var(--fg);
    margin-bottom: 40px;
  }
  .brand svg { display: block; width: 211px; height: 32px; max-width: 100%; }
  .accent { color: var(--accent); }
  h1 {
    font-family: Manrope, system-ui, sans-serif;
    font-size: clamp(26px, 4vw, 32px);
    font-weight: 600; letter-spacing: -0.03em;
    line-height: 1.2; margin-bottom: 16px;
    overflow-wrap: anywhere; text-wrap: balance;
  }
  p {
    font-size: 16px; color: var(--muted-fg); line-height: 1.6;
    max-width: 420px; margin: 0 auto;
  }
  .spinner {
    width: 48px; height: 48px; margin: 0 auto 24px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1.1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-icon {
    width: 48px; height: 48px; margin: 0 auto 24px;
    border: 1px solid var(--border); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center;
    font-family: Manrope, system-ui, sans-serif; font-size: 28px;
  }
  .msg {
    font-family: 'Fragment Mono', ui-monospace, monospace;
    font-size: 13px; font-variant-numeric: tabular-nums;
    text-align: left; background: var(--bg);
    border: 1px solid var(--border); padding: 16px;
    margin: 24px auto; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 30vh; overflow: auto; line-height: 1.6;
  }
  .hint { font-size: 14px; margin-bottom: 28px; }
  .btn {
    appearance: none; display: block; margin-left: auto;
    padding: 12px 24px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text);
    font-family: Manrope, system-ui, sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }
  .btn:hover, .btn:active { background: var(--bg); color: var(--accent-strong); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .hidden { display: none !important; }
  @media (max-width: 480px) {
    .stage { padding: 20px 16px; }
    .card { padding: 28px 24px; }
    .brand { margin-bottom: 32px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>

<script>
  // --- Localization ---------------------------------------------------------
  // Subset of UI strings translated for every Bromure-supported locale.
  // Key matches the lowercase form of the host-provided ?lang= query.
  const T = {
    en: {
      title: "Connecting to VPN",
      subtitle: "Your browser session will start automatically once the VPN is ready.",
      errorTitle: "VPN connection failed",
      errorHint: "Adjust the VPN settings in the profile and try again.",
      close: "Close session",
      errorUnknown: "Unknown error"
    },
    fr: {
      title: "Connexion au VPN",
      subtitle: "Votre session de navigation démarrera automatiquement dès que le VPN sera prêt.",
      errorTitle: "Échec de la connexion VPN",
      errorHint: "Ajustez les paramètres VPN dans le profil et réessayez.",
      close: "Fermer la session",
      errorUnknown: "Erreur inconnue"
    },
    de: {
      title: "Verbindung zum VPN",
      subtitle: "Ihre Browsersitzung startet automatisch, sobald das VPN bereit ist.",
      errorTitle: "VPN-Verbindung fehlgeschlagen",
      errorHint: "Passen Sie die VPN-Einstellungen im Profil an und versuchen Sie es erneut.",
      close: "Sitzung schließen",
      errorUnknown: "Unbekannter Fehler"
    },
    es: {
      title: "Conectando al VPN",
      subtitle: "Su sesión del navegador se iniciará automáticamente en cuanto el VPN esté listo.",
      errorTitle: "Error de conexión al VPN",
      errorHint: "Ajuste la configuración del VPN en el perfil e inténtelo de nuevo.",
      close: "Cerrar sesión",
      errorUnknown: "Error desconocido"
    },
    pt: {
      title: "A ligar ao VPN",
      subtitle: "A sua sessão do navegador iniciará automaticamente assim que o VPN estiver pronto.",
      errorTitle: "Falha na ligação VPN",
      errorHint: "Ajuste as definições do VPN no perfil e tente novamente.",
      close: "Fechar sessão",
      errorUnknown: "Erro desconhecido"
    },
    ja: {
      title: "VPN に接続しています",
      subtitle: "VPN の準備が整い次第、ブラウザーセッションが自動的に開始されます。",
      errorTitle: "VPN 接続に失敗しました",
      errorHint: "プロファイルの VPN 設定を調整してから、もう一度お試しください。",
      close: "セッションを終了",
      errorUnknown: "不明なエラー"
    },
    "zh-cn": {
      title: "正在连接 VPN",
      subtitle: "VPN 准备就绪后，浏览器会话将自动开始。",
      errorTitle: "VPN 连接失败",
      errorHint: "请调整该配置文件的 VPN 设置后重试。",
      close: "关闭会话",
      errorUnknown: "未知错误"
    },
    "zh-tw": {
      title: "正在連接 VPN",
      subtitle: "VPN 就緒後，瀏覽器工作階段將自動開始。",
      errorTitle: "VPN 連線失敗",
      errorHint: "請調整設定檔的 VPN 設定後再試一次。",
      close: "關閉工作階段",
      errorUnknown: "未知錯誤"
    }
  };

  function resolveLocale() {
    const raw = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
    if (!raw) return 'en';
    // Chinese script variants: map zh-Hans / zh-CN → zh-cn, zh-Hant / zh-TW / zh-HK → zh-tw.
    if (raw.startsWith('zh')) {
      if (raw.includes('hant') || raw.includes('tw') || raw.includes('hk')) return 'zh-tw';
      return 'zh-cn';
    }
    const base = raw.split('-')[0];
    return T[base] ? base : 'en';
  }

  const L = T[resolveLocale()];
  document.documentElement.lang = resolveLocale();
  document.getElementById('t-title').textContent = L.title;
  document.getElementById('t-subtitle').textContent = L.subtitle;
  document.getElementById('t-error-title').textContent = L.errorTitle;
  document.getElementById('t-error-hint').textContent = L.errorHint;
  document.getElementById('t-close').textContent = L.close;
  document.getElementById('msg').textContent = L.errorUnknown;
  document.title = 'Bromure — ' + L.title;

  // --- Status polling -------------------------------------------------------
  // Poll the status file written by the VPN agent. The file appears only
  // after auto-connect either succeeds ("ok") or fails ("error\n<message>").
  const STATUS_URL = 'file:///tmp/bromure/vpn-status';
  const loading = document.getElementById('loading');
  const errorPanel = document.getElementById('error');
  const msgEl = document.getElementById('msg');
  let settled = false;

  async function poll() {
    if (settled) return;
    try {
      const r = await fetch(STATUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (r.ok) {
        const text = (await r.text()).replace(/\s+$/, '');
        const firstLine = text.split('\n', 1)[0].trim();
        if (firstLine === 'ok') {
          settled = true;
          // The host-side watcher also kills this window, but self-closing
          // keeps the success path snappy when window.close() is permitted.
          window.close();
          return;
        }
        if (firstLine === 'error') {
          settled = true;
          const errText = text.split('\n').slice(1).join('\n').trim() || L.errorUnknown;
          msgEl.textContent = errText;
          loading.classList.add('hidden');
          errorPanel.classList.remove('hidden');
          return;
        }
      }
    } catch (_) {
      // File not ready yet — keep spinning.
    }
    setTimeout(poll, 400);
  }
  poll();
</script>
