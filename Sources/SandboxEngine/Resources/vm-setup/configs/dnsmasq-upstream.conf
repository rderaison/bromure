# dnsmasq upstream resolvers (pihole.conf: resolv-file=). Cloudflare by
# default; config-agent swaps in 1.1.1.2 / 1.0.0.2 for malware blocking, or
# the host stub when this network hijacks public resolvers. VPN agents
# (WireGuard / OpenVPN / IKEv2) replace these with the VPN's DNS while the
# tunnel is up and restore them on teardown. After any rewrite:
# `pkill -HUP dnsmasq` — SIGHUP re-reads this file and flushes the cache.
nameserver 1.1.1.1
nameserver 1.0.0.1
