# Bromure's per-profile resolver (ad-blocking, malware blocking, VPN DNS).
# config-agent starts it with `dnsmasq -C /etc/dnsmasq.d/pihole.conf` and
# points squid at 127.0.0.1 whenever a switchable resolver is needed.
addn-hosts=/etc/pihole/gravity.list
addn-hosts=/etc/pihole/local.list
addn-hosts=/etc/pihole/custom.list
localise-queries
# Upstreams live in a resolv-file, NOT in server= lines here: dnsmasq
# re-reads a resolv-file on SIGHUP (flushing its cache) and polls it, but
# never re-reads server= lines once running — so every runtime swap (a VPN
# pushing its DNS, the boot-time hijack fallback) used to be a silent no-op.
# Agents rewrite upstream.conf and `pkill -HUP dnsmasq`.
resolv-file=/etc/dnsmasq.d/upstream.conf
log-queries
log-facility=/var/log/pihole/pihole.log
log-async
cache-size=10000
domain-needed
expand-hosts
bogus-priv
except-interface=nonexisting
listen-address=127.0.0.1
bind-interfaces
