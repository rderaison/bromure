net.core.somaxconn=1024
net.core.netdev_max_backlog=2000
net.core.rmem_max=16777216
net.core.wmem_max=16777216
net.core.default_qdisc=fq
net.ipv4.tcp_rmem=4096 87380 16777216
net.ipv4.tcp_wmem=4096 65536 16777216
net.ipv4.tcp_max_syn_backlog=2048
net.ipv4.tcp_tw_reuse=1
net.ipv4.ip_local_port_range=1024 65535
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_max_tw_buckets=16384
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_notsent_lowat=16384
net.ipv4.tcp_congestion_control=bbr
net.nf_conntrack_max=32768
vm.swappiness=35

# No IPv6 on the NAT interface. vmnet advertises RAs but the v4-only
# NAT/filter path can't route the resulting SLAAC address, so every v6
# connect blackholes (~10s each): routing-socks/squid stall sequentially
# on AAAA records, and the late-arriving SLAAC address makes Chromium
# throw ERR_NETWORK_CHANGED mid-load. Alpine never accepted RAs; make
# Ubuntu match. VPN-created interfaces (wg0, CloudflareWARP) configure
# their own addresses explicitly and are unaffected.
net.ipv6.conf.eth0.disable_ipv6=1
net.ipv6.conf.eth0.accept_ra=0
net.ipv6.conf.default.accept_ra=0
