version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /app, /var/log, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  user_rule:
    name: user_rule
    endpoints:
      - host: 10.200.0.2
        port: 19876
    binaries:
      - path: /**
  approved_rule:
    name: approved_rule
    endpoints:
      - host: 10.200.0.2
        port: 19876
        allowed_ips: [10.200.0.0/24]
    binaries:
      - path: /**
