version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

@@MIDDLEWARES@@
network_policies:
  proxy_egress_test:
    name: proxy_egress_test
    endpoints:
      - host: @@HOST@@
        port: @@PORT@@
@@ENDPOINT_OPTIONS@@
        allowed_ips:
          - "10.0.0.0/8"
          - "172.0.0.0/8"
          - "192.168.0.0/16"
          - "fc00::/7"
    binaries:
      - path: "/**"
