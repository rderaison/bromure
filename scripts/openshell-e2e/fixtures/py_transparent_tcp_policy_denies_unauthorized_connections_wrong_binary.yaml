version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /etc, /app, /var/log, /proc, /dev/urandom]
  read_write: [/sandbox, /tmp]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  test_rule:
    name: test_rule
    endpoints:
      - host: 1.1.1.1
        port: 443
    binaries:
      - path: /bin/false
