[package]
name = "openshell-diff"
version = "0.1.0"
edition = "2021"

# The point of this crate is to run OpenShell's ACTUAL enforcement — the same
# `landlock` and `seccompiler` crates, called the same way — so the Python
# reimplementation in ../bromure_openshell.py can be diffed against it rather
# than against a reading of the source.
[dependencies]
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
