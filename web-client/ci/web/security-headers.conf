# Sent on every response (nginx drops server-level add_header in any location
# that has its own, so each location includes this). Referrer-Policy is the
# edge's (its haproxy rewrites that header globally).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://bromure.io; frame-ancestors 'none'; base-uri 'self'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
