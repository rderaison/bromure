# bromure.io/client/ — the hosted Bromure Client (static SPA). The edge passes
# the full path (/client/...), so the bundle lives under html/client/.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;      # behind the edge: keep redirects path-only

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location = /client { include /etc/nginx/snippets/security-headers.conf; return 301 /client/; }

    # Content-hashed bundles: cache forever; a miss is a real 404, never index.html.
    location /client/assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else under /client/ (index.html and SPA routes): always revalidate,
    # so a deploy is picked up on the next load.
    location /client/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /client/index.html;
    }

    location / { return 404; }
}
